<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محل الخياطة - تالبورجت</title>
    <style>
        :root {
            --card-bg: rgb(155, 155, 155);
            --primary-color: #b45309;
            --text-color: #1f2937;
            --text-muted: #4b5563;
            --border-color: #d1d5db;
            --danger-color: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                        url('https://images.unsplash.com/photo-1558769132-cb1aea458c5e?auto=format&fit=crop&w=1600&q=80') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-color);
            padding: 12px;
            min-height: 100vh;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        header {
            text-align: center;
            padding: 16px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        header h1 {
            color: #92400e;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        header p {
            color: var(--text-muted);
            font-size: 12px;
        }

        .card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .card h2 {
            font-size: 15px;
            margin-bottom: 12px;
            color: #92400e;
            font-weight: 700;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 6px;
        }

        .toggle-form-btn {
            background: #b45309;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 700;
            width: 100%;
            box-shadow: 0 4px 10px rgba(180, 83, 9, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .toggle-form-btn:hover {
            background: #92400e;
        }

        #formContainer {
            display: none;
            margin-top: 12px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stats-box {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 12px;
            text-align: center;
        }

        .stat-card {
            background: #fdf8f6;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
        }

        .stat-number {
            font-size: 16px;
            font-weight: 700;
            color: #b45309;
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-muted);
        }

        .form-section {
            background: #fdf8f6;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .form-section-title {
            font-size: 12px;
            color: #b45309;
            font-weight: 700;
            margin-bottom: 6px;
            display: block;
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 11px;
            margin-bottom: 3px;
            color: var(--text-muted);
            font-weight: 600;
        }

        input, select {
            width: 100%;
            background-color: #ffffff;
            color: var(--text-color);
            padding: 9px;
            border: 1px solid #9ca3af;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #b45309;
            box-shadow: 0 0 0 2px rgba(180, 83, 9, 0.15);
        }

        .date-quick-buttons {
            display: flex;
            gap: 5px;
            margin-top: 4px;
        }

        .date-btn {
            flex: 1;
            background: #f3f4f6;
            color: var(--text-muted);
            border: 1px solid #9ca3af;
            padding: 6px;
            border-radius: 5px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
            text-align: center;
        }

        .date-btn.active {
            background: #b45309;
            color: #ffffff;
            border-color: #b45309;
        }

        /* تصميم صف القياس الحر المضاف */
        .dynamic-meas-row {
            display: grid;
            grid-template-columns: 2fr 1.5fr 1.5fr 40px;
            gap: 5px;
            align-items: center;
            margin-bottom: 6px;
            background: #ffffff;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
        }

        .add-meas-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 4px;
        }

        .remove-row-btn {
            background: var(--danger-color);
            color: white;
            border: none;
            border-radius: 5px;
            padding: 8px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        button.submit-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 11px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 700;
            width: 100%;
            margin-top: 8px;
        }

        button.submit-btn:hover {
            opacity: 0.9;
        }

        .search-box {
            width: 100%;
            margin-bottom: 10px;
            padding: 10px;
            background-color: #ffffff;
            border: 1px solid #9ca3af;
            border-radius: 6px;
            color: var(--text-color);
            font-size: 13px;
        }

        .filter-bar {
            display: flex;
            gap: 5px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .filter-btn {
            flex: 1;
            background: #f3f4f6;
            color: var(--text-muted);
            border: 1px solid #9ca3af;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 600;
            text-align: center;
        }

        .filter-btn.active-filter {
            background: #92400e;
            color: #ffffff;
            border-color: #92400e;
        }

        .customer-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .customer-item {
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }

        .card-pending { background: #ffefad; border-color: #ffa200; }
        .card-working { background: #bfdbff; border-color: #0062ff; }
        .card-ready { background: #bbffdf; border-color: #009463; }

        .photos-container {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .item-photo {
            width: 50px;
            height: 50px;
            border-radius: 5px;
            object-fit: cover;
            border: 1px solid #9ca3af;
            background-color: #f3f4f6;
            cursor: pointer;
            flex-shrink: 0;
        }

        .item-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .customer-name {
            font-size: 16px;
            color: #111827;
            font-weight: 700;
        }

        .customer-phone {
            font-size: 12px;
            color: var(--text-muted);
        }

        .order-box {
            background-color: rgba(0, 0, 0, 0.04);
            padding: 7px 9px;
            border-radius: 5px;
            border-right: 3px solid #b45309;
            font-size: 13px;
            color: #1f2937;
        }

        .measurements-box {
            background-color: rgba(0, 0, 0, 0.04);
            border: 1px solid #cbd5e1;
            padding: 8px;
            border-radius: 6px;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .measurements-title {
            font-weight: 700;
            color: #b45309;
            margin-bottom: 2px;
        }

        .meas-item {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.04);
            padding: 5px 8px;
            border-radius: 5px;
        }

        .due-date-highlight {
            color: #b45309;
            font-weight: 700;
        }

        .status-bar {
            display: flex;
            gap: 4px;
        }

        .status-btn {
            flex: 1;
            padding: 6px;
            font-size: 10px;
            border-radius: 5px;
            border: 1px solid #9ca3af;
            cursor: pointer;
            font-weight: 600;
            background: #ffffff;
            color: var(--text-muted);
            text-align: center;
        }

        .status-btn.active {
            background: #1f2937;
            color: #ffffff;
            border-color: #1f2937;
        }

        .actions-bottom {
            display: flex;
            gap: 5px;
        }

        .wa-btn {
            background-color: #25D366;
            color: #fff;
            padding: 7px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex: 2;
        }

        .delete-btn {
            background-color: var(--danger-color);
            color: white;
            padding: 7px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            flex: 1;
            font-weight: 600;
        }

        #lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>✂️ محل الخياطة - تالبورجت</h1>
            <p>دفتر الزبناء والطلبات السريع</p>
        </header>

        <button class="toggle-form-btn" onclick="toggleForm()">
            <span id="toggleIcon">➕</span> <span id="toggleText">إضافة طلب جديد</span>
        </button>

        <div class="card" id="formContainer">
            <h2>تسجيل طلب جديد</h2>
            <form id="customerForm">
                
                <div class="form-section">
                    <span class="form-section-title">1. معلومات الزبون</span>
                    <div class="form-grid">
                        <div class="form-row">
                            <div class="form-group">
                                <label>اسم الزبون:</label>
                                <input type="text" id="name" required placeholder="مثال: يوسف العلوي">
                            </div>
                            <div class="form-group">
                                <label>رقم الهاتف (اختياري):</label>
                                <input type="text" id="phone" placeholder="مثال: 212600000000+">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <span class="form-section-title">2. تفاصيل العمل والموعد</span>
                    <div class="form-grid">
                        <div class="form-row">
                            <div class="form-group">
                                <label>نوع العمل (تعديل / تفصيل Ref):</label>
                                <input type="text" id="alteration" required placeholder="مثال: تطويل أكمام قميص">
                            </div>
                            <div class="form-group">
                                <label>صور الموديل (عدة صور):</label>
                                <input type="file" id="itemPhotos" accept="image/*" multiple>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>موعد الاستلام:</label>
                            <div class="date-quick-buttons">
                                <button type="button" class="date-btn" onclick="setDueDateDays(1, this)">غداً</button>
                                <button type="button" class="date-btn" onclick="setDueDateDays(3, this)">بعد 3 أيام</button>
                                <button type="button" class="date-btn" onclick="setDueDateDays(7, this)">خلال أسبوع</button>
                            </div>
                            <input type="date" id="dueDate" style="margin-top: 5px;" required>
                        </div>

                        <div class="form-group">
                            <label>الحالة الأولية:</label>
                            <select id="status">
                                <option value="قيد الانتظار">قيد الانتظار</option>
                                <option value="جاري العمل">جاري العمل</option>
                                <option value="جاهز للاستلام">جاهز للاستلام</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- القسم المحدث: القياسات الحرة المرنة حسب طلب الزبون -->
                <div class="form-section">
                    <span class="form-section-title">3. قياسات أو تعديلات الزبون (اختياري)</span>
                    <div id="dynamicMeasurementsContainer">
                        <!-- سيتم إضافة حقول القياسات هنا ديناميكياً -->
                    </div>
                    <button type="button" class="add-meas-btn" onclick="addMeasurementRow()">➕ إضافة قياس جديد</button>
                </div>

                <button type="submit" class="submit-btn">حفظ الطلب الجديد</button>
            </form>
        </div>

        <div class="card">
            <h2>📋 قائمة الطلبات النشطة</h2>
            
            <div class="stats-box">
                <div class="stat-card">
                    <div class="stat-number" id="totalCount">0</div>
                    <div class="stat-label">إجمالي الطلبات</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="workingCount">0</div>
                    <div class="stat-label">قيد العمل والانتظار</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="readyCount">0</div>
                    <div class="stat-label">جاهز للاستلام</div>
                </div>
            </div>

            <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث باسم الزبون أو نوع الطلب...">
            
            <div class="filter-bar">
                <button class="filter-btn active-filter" onclick="setFilter('الكل', this)">الكل</button>
                <button class="filter-btn" onclick="setFilter('قيد الانتظار', this)">قيد الانتظار</button>
                <button class="filter-btn" onclick="setFilter('جاري العمل', this)">جاري العمل</button>
                <button class="filter-btn" onclick="setFilter('جاهز للاستلام', this)">جاهز للاستلام</button>
            </div>

            <div id="customerList" class="customer-list"></div>
        </div>
    </div>

    <div id="lightbox" onclick="this.style.display='none'">
        <img id="lightboxImg" src="">
    </div>

    <script>
        let customers = JSON.parse(localStorage.getItem('tailor_customers_dynamic')) || [];
        let currentStatusFilter = 'الكل';
        let tempPhotos = [];

        const form = document.getElementById('customerForm');
        const customerList = document.getElementById('customerList');
        const searchInput = document.getElementById('searchInput');
        const formContainer = document.getElementById('formContainer');
        const dynamicContainer = document.getElementById('dynamicMeasurementsContainer');

        function toggleForm() {
            if (formContainer.style.display === 'block') {
                formContainer.style.display = 'none';
                document.getElementById('toggleIcon').textContent = '➕';
                document.getElementById('toggleText').textContent = 'إضافة طلب جديد';
            } else {
                formContainer.style.display = 'block';
                document.getElementById('toggleIcon').textContent = '❌';
                document.getElementById('toggleText').textContent = 'إغلاق نموذج الإضافة';
                if (dynamicContainer.children.length === 0) {
                    addMeasurementRow(); // إضافة سطر قياس افتراضي عند الفتح
                }
            }
        }

        // دالة لإضافة سطر قياس جديد حر
        function addMeasurementRow(part = '', before = '', after = '') {
            const row = document.createElement('div');
            row.className = 'dynamic-meas-row';
            row.innerHTML = `
                <input type="text" class="meas-part" placeholder="اسم القياس (مثال: الطول)" value="${part}">
                <input type="text" class="meas-before" placeholder="قبل" value="${before}">
                <input type="text" class="meas-after" placeholder="بعد" value="${after}">
                <button type="button" class="remove-row-btn" onclick="this.parentElement.remove()">✕</button>
            `;
            dynamicContainer.appendChild(row);
        }

        function saveToLocalStorage() {
            localStorage.setItem('tailor_customers_dynamic', JSON.stringify(customers));
        }

        function updateStats() {
            const total = customers.length;
            const ready = customers.filter(c => c.status === 'جاهز للاستلام').length;
            const working = total - ready;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('workingCount').textContent = working;
            document.getElementById('readyCount').textContent = ready;
        }

        window.setDueDateDays = function(days, btnElement) {
            const d = new Date();
            d.setDate(d.getDate() + days);
            document.getElementById('dueDate').value = d.toISOString().split('T')[0];
            
            document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
        }

        function getTimeAgo(dateString) {
            if (!dateString) return 'اليوم';
            const savedDate = new Date(dateString);
            const now = new Date();
            const diffTime = Math.abs(now - savedDate);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            if (diffDays === 0) return 'اليوم';
            if (diffDays === 1) return 'أمس';
            return `منذ ${diffDays} أيام`;
        }

        document.getElementById('itemPhotos').addEventListener('change', function(e) {
            const files = e.target.files;
            tempPhotos = [];
            if (files.length > 0) {
                for (let i = 0; i < files.length; i++) {
                    const reader = new FileReader();
                    reader.onloadend = function(event) {
                        tempPhotos.push(event.target.result);
                    }
                    reader.readAsDataURL(files[i]);
                }
            }
        });

        function renderCustomers() {
            updateStats();
            customerList.innerHTML = '';
            const searchText = searchInput.value.toLowerCase();
            
            const filtered = customers.filter(c => {
                const matchesSearch = c.name.toLowerCase().includes(searchText) || 
                                      (c.phone && c.phone.includes(searchText)) ||
                                      c.alteration.toLowerCase().includes(searchText);
                const matchesStatus = (currentStatusFilter === 'الكل' || c.status === currentStatusFilter);
                return matchesSearch && matchesStatus;
            });

            if (filtered.length === 0) {
                customerList.innerHTML = '<p style="text-align: center; color: #ffffff; padding: 15px; text-shadow: 0 1px 3px rgba(0,0,0,0.8);">لا توجد طلبات مسجلة.</p>';
                return;
            }

            filtered.forEach((cust) => {
                const realIndex = customers.indexOf(cust);
                let timeAgoText = getTimeAgo(cust.createdAt);

                let cardColorClass = 'card-pending';
                if (cust.status === 'جاري العمل') cardColorClass = 'card-working';
                if (cust.status === 'جاهز للاستلام') cardColorClass = 'card-ready';

                let photosHtml = '';
                if (cust.photos && cust.photos.length > 0) {
                    photosHtml = `<div class="photos-container">`;
                    cust.photos.forEach(p => {
                        photosHtml += `<img src="${p}" class="item-photo" onclick="openLightbox('${p}')">`;
                    });
                    photosHtml += `</div>`;
                }

                let measurementsHtml = '';
                if (cust.measurements && cust.measurements.length > 0) {
                    measurementsHtml = `<div class="measurements-box"><span class="measurements-title">📏 تفاصيل القياسات:</span>`;
                    cust.measurements.forEach(m => {
                        measurementsHtml += `<div class="meas-item"><span><b>${m.part}:</b></span> <span>${m.before || '...'} ➔ ${m.after || '...'}</span></div>`;
                    });
                    measurementsHtml += `</div>`;
                }

                let waActionHtml = '';
                if (cust.phone && cust.phone.trim() !== '') {
                    let waMessage = `مرحباً ${cust.name}، نخبرك من محل الخياطة بتالبورجت أن طلبك (${cust.alteration}) أصبح (${cust.status}). موعد الاستلام: ${cust.dueDate}. مرحبا بك!`;
                    let waUrl = `https://wa.me/${cust.phone}?text=${encodeURIComponent(waMessage)}`;
                    waActionHtml = `<a href="${waUrl}" target="_blank" class="wa-btn">💬 إرسال واتساب للزبون</a>`;
                }

                const div = document.createElement('div');
                div.className = `customer-item ${cardColorClass}`;
                div.innerHTML = `
                    <div class="item-top">
                        <div>
                            <div class="customer-name">${cust.name}</div>
                            <div class="customer-phone">${cust.phone ? '📞 ' + cust.phone : 'بدون رقم هاتف'}</div>
                        </div>
                        ${photosHtml}
                    </div>

                    <div class="order-box">
                        ⚙️ <b>الطلب:</b> ${cust.alteration}
                    </div>

                    ${measurementsHtml}

                    <div class="info-row">
                        <span>📅 الموعد: <b class="due-date-highlight">${cust.dueDate}</b></span>
                        <span>⏱️ ${timeAgoText}</span>
                    </div>

                    <div class="status-bar">
                        <button class="status-btn ${cust.status === 'قيد الانتظار' ? 'active' : ''}" onclick="changeStatus(${realIndex}, 'قيد الانتظار')">انتظار</button>
                        <button class="status-btn ${cust.status === 'جاري العمل' ? 'active' : ''}" onclick="changeStatus(${realIndex}, 'جاري العمل')">جاري</button>
                        <button class="status-btn ${cust.status === 'جاهز للاستلام' ? 'active' : ''}" onclick="changeStatus(${realIndex}, 'جاهز للاستلام')">جاهز</button>
                    </div>

                    <div class="actions-bottom">
                        ${waActionHtml}
                        <button class="delete-btn" onclick="deleteCustomer(${realIndex})">حذف</button>
                    </div>
                `;
                customerList.appendChild(div);
            });
        }

        window.openLightbox = function(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }

        window.setFilter = function(status, btnElement) {
            currentStatusFilter = status;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active-filter'));
            btnElement.classList.add('active-filter');
            renderCustomers();
        }

        window.changeStatus = function(index, newStatus) {
            customers[index].status = newStatus;
            saveToLocalStorage();
            renderCustomers();
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // جمع القياسات الديناميكية المدخلة
            const measurements = [];
            const rows = dynamicContainer.querySelectorAll('.dynamic-meas-row');
            rows.forEach(r => {
                const part = r.querySelector('.meas-part').value.trim();
                const before = r.querySelector('.meas-before').value.trim();
                const after = r.querySelector('.meas-after').value.trim();
                if (part || before || after) {
                    measurements.push({ part: part || 'قياس', before, after });
                }
            });

            const newCustomer = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                status: document.getElementById('status').value,
                dueDate: document.getElementById('dueDate').value,
                alteration: document.getElementById('alteration').value,
                measurements: measurements,
                photos: tempPhotos || [],
                createdAt: new Date().toISOString()
            };

            customers.unshift(newCustomer);
            saveToLocalStorage();
            renderCustomers();
            form.reset();
            tempPhotos = [];
            dynamicContainer.innerHTML = '';
            document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
            toggleForm();
        });

        window.deleteCustomer = function(index) {
            if(confirm('هل أنت متأكد من حذف هذا الطلب؟')) {
                customers.splice(index, 1);
                saveToLocalStorage();
                renderCustomers();
            }
        }

        searchInput.addEventListener('input', renderCustomers);

        renderCustomers();
    </script>
</body>
</html>
